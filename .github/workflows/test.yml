name: test
on: [push, pull_request]
jobs:
  dogfood-snapshot:
    # Run snapshot on main branch to save baseline errors
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.11' }

    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install requirements
      run: uv pip install --system mypy

    - name: Setup Git user
      run: |
        git config --global user.email "report-new-linter-errors@mail.invalid"
        git config --global user.name "report-new-linter-errors"
    - name: Update snapshot for main branch
      run: |
        make
        python report-new-linter-errors snapshot mypy mypy -- report_new_linter_errors.py
        git add .report-new-linter-errors/
        git commit -m "Update report-new-linter-errors snapshot" || true
        git push

  dogfood-run:
    # Run verification on non-main branches to check for new errors
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch all history to access the baseline commit
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.11' }

    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install requirements
      run: uv pip install --system mypy

    - name: Fetch baseline commit
      run: |
        if [ -f .report-new-linter-errors/mypy/commit ]; then
          git fetch origin "$(cat .report-new-linter-errors/mypy/commit)" || true
        fi
    - name: Run report-new-linter-errors to verify no new errors
      run: |
        make
        python report-new-linter-errors run mypy

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/ruff-action@v3
      with: { args: '--version' }
    - run: ruff format --diff report_new_linter_errors.py test.py
    - run: ruff check --diff report_new_linter_errors.py test.py

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with: { python-version: '3.11' }
    - run: python test.py
